# 常用软件抽样（阶段 0 覆盖率实验里命中较多的几个）。都是草稿，只用于说明是谁的，不给出清理建议。
locations:
  - id: app.dingtalk.data
    under: '%APPDATA%\DingTalk'
    kind: app-data
    risk: high
    tier: draft
    purpose: 钉钉的聊天记录、文件和缓存
    impact: 删除会丢失本地聊天记录和下载的文件。请在钉钉的"设置 → 通用 → 存储空间"里清理
    actions:
      - guide: 在钉钉的"设置 → 通用 → 存储空间"里清理缓存，或更改文件存储位置

  - id: app.dingtalk.program
    under: '%LOCALAPPDATA%\DingTalk_*'
    kind: program
    risk: never
    tier: draft
    purpose: 钉钉程序
    impact: 不要手动删除，请在"设置 → 应用"里卸载

  - id: app.wechat
    under: '%APPDATA%\Tencent\xwechat'
    kind: user-data
    risk: high
    tier: draft
    purpose: 微信（4.x）的聊天记录和文件
    impact: 删除会丢失聊天记录。请在微信的"设置 → 存储空间"里清理或更改存储位置
    actions:
      - guide: 在微信的"设置 → 存储空间"里管理

  - id: app.tencent
    under: '%APPDATA%\Tencent'
    kind: app-data
    risk: high
    tier: draft
    purpose: 腾讯系软件（QQ、微信、腾讯会议等）的本地数据
    impact: 删除可能丢失聊天记录和登录状态，请在对应软件里清理

  - id: app.perplexity
    under: '%LOCALAPPDATA%\Perplexity'
    kind: browser-data
    risk: medium
    tier: draft
    purpose: Perplexity Comet 浏览器的数据
    impact: 删除会丢失浏览记录和登录状态

  - id: app.sogou.models
    dir: '%LOCALLOW%\SogouPY\models'
    kind: model
    risk: low
    tier: draft
    purpose: 搜狗输入法下载的智能联想模型
    impact: 删除后输入法会在需要时重新下载
    evidence:
      - note: 由目录名和内容推断，未实测

  - id: app.sogou
    under: '%LOCALLOW%\SogouPY'
    kind: app-data
    risk: medium
    tier: draft
    purpose: 搜狗输入法的用户词库和设置
    impact: 删除会丢失没有同步的用户词库

  - id: app.onedrive.program
    under: '%LOCALAPPDATA%\Microsoft\OneDrive'
    kind: program
    risk: never
    purpose: OneDrive 客户端程序
    impact: 不要手动删除

  - id: app.edge-webview
    under: '%LOCALAPPDATA%\Microsoft\EdgeWebView'
    kind: program
    risk: never
    purpose: Edge WebView2 运行时，很多程序依赖它显示网页界面
    impact: 不要手动删除
