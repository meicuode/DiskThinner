# Windows 系统位置。大多只能用系统设置或官方工具处理（risk: guide），少数临时文件和转储可以直接删。
locations:
  - id: sys.pagefile
    file: '%SYSTEMDRIVE%\pagefile.sys'
    kind: system
    risk: guide
    label: 系统设置
    purpose: 分页文件（虚拟内存），物理内存不够时用来存放暂时换出的内存页
    impact: 不能直接删除。可以在"高级系统设置 → 性能 → 虚拟内存"里调小或移到其他盘
    actions:
      - guide: 在"系统属性 → 高级 → 性能设置 → 高级 → 虚拟内存"里调整
    evidence:
      - url: https://learn.microsoft.com/troubleshoot/windows-client/performance/introduction-to-the-page-file

  - id: sys.hiberfil
    file: '%SYSTEMDRIVE%\hiberfil.sys'
    kind: system
    risk: guide
    label: 系统设置
    purpose: 休眠文件，休眠和快速启动时保存内存内容
    impact: 不能直接删除。不用休眠的话，以管理员身份运行 powercfg /hibernate off 会自动删掉它，快速启动也会一起关闭
    actions:
      - guide: 以管理员身份运行 powercfg /hibernate off
    evidence:
      - url: https://learn.microsoft.com/windows-hardware/design/device-experiences/powercfg-command-line-options

  - id: sys.swapfile
    file: '%SYSTEMDRIVE%\swapfile.sys'
    kind: system
    risk: guide
    label: 系统设置
    purpose: 商店应用挂起时使用的交换文件，由系统按需管理
    impact: 不能直接删除，跟随分页文件设置
    evidence:
      - note: 由 Windows 内存管理器创建和管理

  - id: sys.ntfs-metadata
    file: '%SYSTEMDRIVE%\$*'
    kind: system
    risk: never
    purpose: NTFS 文件系统的内部文件（主文件表 $MFT、日志 $LogFile 等）
    impact: 由文件系统自己管理，不能删除

  - id: sys.ntfs-extend
    dir: '%SYSTEMDRIVE%\$Extend'
    kind: system
    risk: never
    purpose: NTFS 扩展元数据（变更日志 $UsnJrnl、配额等）
    impact: 由文件系统自己管理，不能删除

  - id: sys.recycle-bin
    dir: '%SYSTEMDRIVE%\$Recycle.Bin'
    kind: recycle-bin
    risk: medium
    purpose: 回收站，从这个盘删除的文件先放在这里
    impact: 清空后这些文件无法再从回收站还原
    actions:
      - guide: 在桌面的回收站上右键"清空回收站"
    evidence:
      - note: Windows 每个盘有自己的回收站，C 盘回收站占用的是 C 盘空间

  - id: sys.system-volume-information
    dir: '%SYSTEMDRIVE%\System Volume Information'
    kind: system
    risk: guide
    label: 系统设置
    purpose: 系统还原点（卷影副本）和索引等系统数据
    impact: 不能直接删除。可以在"系统属性 → 系统保护 → 配置"里调小还原点占用的空间，或删除所有还原点
    actions:
      - guide: 在"系统属性 → 系统保护 → 配置"里调整最大使用量
    evidence:
      - url: https://learn.microsoft.com/windows-server/administration/windows-commands/vssadmin-resize-shadowstorage

  - id: sys.recovery
    under: '%SYSTEMDRIVE%\Recovery'
    kind: system
    risk: never
    purpose: 系统恢复环境和电脑厂商的恢复配置（如 Customizations\usmt.ppkg）
    impact: 删除后可能无法使用"重置此电脑"或厂商的恢复功能

  - id: sys.windows-old
    dir: '%SYSTEMDRIVE%\Windows.old'
    kind: backup
    risk: guide
    label: 存储设置
    purpose: 升级 Windows 后保留的旧系统，用于回退到之前的版本
    impact: 删除后无法回退。请在"设置 → 系统 → 存储 → 临时文件 → 以前的 Windows 安装"里删除
    actions:
      - guide: 在"设置 → 系统 → 存储 → 临时文件"里勾选"以前的 Windows 安装"
    evidence:
      - url: https://support.microsoft.com/windows/delete-your-previous-version-of-windows-f8b26680-e083-c710-b757-7567d69dbb74

  - id: sys.windows-upgrade-temp
    dir: '%SYSTEMDRIVE%\{$WINDOWS.~BT,$Windows.~WS}'
    kind: update-cache
    risk: guide
    label: 存储设置
    purpose: Windows 功能更新的临时安装文件
    impact: 升级完成后不再需要，用"存储设置 → 临时文件"清理
    evidence:
      - note: Windows 安装程序的工作目录

  - id: sys.inetpub-logs
    dir: '%SYSTEMDRIVE%\inetpub\logs'
    kind: log
    risk: medium
    purpose: 本机 IIS 网站的访问日志
    impact: 删除后丢失历史访问记录，不影响网站运行
    actions:
      - delete: children
        older_than_days: 30
    evidence:
      - url: https://learn.microsoft.com/iis/manage/provisioning-and-managing-iis/managing-iis-log-file-storage

  # ---------- Windows 目录 ----------
  - id: sys.windows
    under: '%WINDIR%'
    kind: system
    risk: never
    purpose: Windows 系统文件
    impact: 不能手动删除。系统自带的清理在"设置 → 系统 → 存储 → 临时文件"里

  - id: sys.winsxs
    dir: '%WINDIR%\WinSxS'
    kind: system
    risk: guide
    label: 用 DISM 清理
    purpose: 组件存储，保存系统组件和更新，很多文件和 System32 共用（硬链接），显示的大小比实际独占的大
    impact: 不能手动删除，否则系统无法更新或修复。用 DISM 清理被新版本替代的组件
    actions:
      - guide: 以管理员身份运行 DISM /Online /Cleanup-Image /AnalyzeComponentStore 查看可清理量，再运行 DISM /Online /Cleanup-Image /StartComponentCleanup
        url: https://learn.microsoft.com/windows-hardware/manufacture/desktop/clean-up-the-winsxs-folder
    evidence:
      - url: https://learn.microsoft.com/windows-hardware/manufacture/desktop/determine-the-actual-size-of-the-winsxs-folder

  - id: sys.windows-installer
    dir: '%WINDIR%\Installer'
    kind: update-cache
    risk: guide
    label: 不要手动删
    purpose: 已安装程序的安装包缓存（.msi / .msp），修复、更新和卸载程序时要用
    impact: 手动删除后，对应程序可能无法更新、修复或卸载
    evidence:
      - url: https://learn.microsoft.com/troubleshoot/windows-client/application-management/missing-windows-installer-cache

  - id: sys.windows-temp
    dir: '%WINDIR%\Temp'
    kind: temp
    risk: safe
    regenerates: true
    purpose: 系统和服务使用的临时文件
    impact: 正在使用的文件会被跳过；只删 1 天前的文件更稳妥
    actions:
      - delete: contents
        older_than_days: 1
    evidence:
      - url: https://support.microsoft.com/windows/free-up-drive-space-in-windows-85529ccb-c365-490d-b548-831022bc9b32

  - id: sys.service-temp
    dir: '%WINDIR%\ServiceProfiles\*\AppData\Local\Temp'
    kind: temp
    risk: safe
    regenerates: true
    purpose: 系统服务账户（LocalService、NetworkService）的临时文件，有时会积累很大的崩溃转储
    impact: 正在使用的文件会被跳过
    actions:
      - delete: contents
        older_than_days: 1
    evidence:
      - note: 服务账户的 %TEMP%，与用户 Temp 目录性质相同

  - id: sys.delivery-optimization
    dir: '%WINDIR%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache'
    kind: update-cache
    risk: safe
    regenerates: true
    purpose: 传递优化缓存，Windows 更新和商店下载的分片，也用于分享给局域网内其他电脑
    impact: 删除后需要时会重新下载。系统自带的"临时文件"清理里的"传递优化文件"就是它
    actions:
      - guide: 在"设置 → 系统 → 存储 → 临时文件"里勾选"传递优化文件"
    evidence:
      - url: https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization

  - id: sys.wu-download
    dir: '%WINDIR%\SoftwareDistribution\Download'
    kind: update-cache
    risk: safe
    regenerates: true
    purpose: Windows 更新下载的安装文件
    impact: 更新安装完后不再需要；正在下载或安装更新时不要清理
    actions:
      - guide: 在"设置 → 系统 → 存储 → 临时文件"里勾选"Windows 更新清理"
    evidence:
      - url: https://learn.microsoft.com/troubleshoot/windows-client/installing-updates-features-roles/additional-resources-for-windows-update

  - id: sys.livekernel
    dir: '%WINDIR%\LiveKernelReports'
    kind: crash-dump
    risk: safe
    purpose: 内核实时转储，驱动或硬件出问题时系统自动生成（常见的有 WATCHDOG、GreLKD），单个可达几 GB
    impact: 删除后无法再用这些转储分析当时的问题
    actions:
      - delete: contents
    evidence:
      - url: https://learn.microsoft.com/windows-hardware/drivers/debugger/live-kernel-reports

  - id: sys.minidump
    dir: '%WINDIR%\Minidump'
    kind: crash-dump
    risk: safe
    purpose: 蓝屏时生成的小型内存转储
    impact: 删除后无法再用它们分析蓝屏原因
    actions:
      - delete: contents
    evidence:
      - url: https://learn.microsoft.com/troubleshoot/windows-client/performance/memory-dump-file-options

  - id: sys.memory-dmp
    file: '%WINDIR%\MEMORY.DMP'
    kind: crash-dump
    risk: safe
    purpose: 蓝屏时生成的完整内存转储
    impact: 删除后无法再用它分析蓝屏原因
    actions:
      - delete: self
    evidence:
      - url: https://learn.microsoft.com/troubleshoot/windows-client/performance/memory-dump-file-options

  - id: sys.aspnet-temp
    dir: '%WINDIR%\Microsoft.NET\*\*\Temporary ASP.NET Files'
    kind: build-output
    risk: safe
    regenerates: true
    requires_closed: true
    purpose: ASP.NET（.NET Framework）网站的编译缓存，开发网站时会越来越大
    impact: 下次打开网站时重新编译，首次访问会慢一些；Visual Studio 或 IIS 正在用的文件会被跳过
    actions:
      - delete: contents
    evidence:
      - note: ASP.NET 动态编译的输出目录，删除后按需重新生成

  - id: sys.windows-logs
    dir: '%WINDIR%\Logs'
    kind: log
    risk: guide
    label: 系统清理
    purpose: Windows 组件的日志（CBS、DISM、Windows 更新等）
    impact: 用"设置 → 系统 → 存储 → 临时文件"清理，不要手动删
    evidence:
      - note: 部分日志由正在运行的系统服务持有

  # ---------- ProgramData ----------
  - id: sys.wer
    dir: '%PROGRAMDATA%\Microsoft\Windows\WER'
    kind: crash-dump
    risk: safe
    purpose: Windows 错误报告，程序崩溃时生成的报告和转储
    impact: 删除后无法再查看或提交这些错误报告
    actions:
      - delete: contents
    evidence:
      - url: https://learn.microsoft.com/windows/win32/wer/wer-settings

  - id: sys.defender
    dir: '%PROGRAMDATA%\Microsoft\Windows Defender'
    kind: system
    risk: never
    purpose: Microsoft Defender 的病毒库、隔离区和扫描历史
    impact: 不能手动删除

  - id: sys.package-cache
    dir: '%PROGRAMDATA%\Package Cache'
    kind: update-cache
    risk: guide
    label: 不要手动删
    purpose: 安装程序（WiX Burn，如 Visual Studio、.NET、VC++ 运行库）保存的安装包
    impact: 手动删除后，对应程序可能无法修复、更新或卸载
    evidence:
      - url: https://wixtoolset.org/docs/tools/burn/

  - id: sys.user-package-cache
    dir: '%LOCALAPPDATA%\Package Cache'
    kind: update-cache
    risk: guide
    label: 不要手动删
    purpose: 按用户安装的程序保存的安装包（WiX Burn）
    impact: 手动删除后，对应程序可能无法修复、更新或卸载
    evidence:
      - url: https://wixtoolset.org/docs/tools/burn/

  - id: sys.downloaded-installations
    dir: '%PROGRAMDATA%\Downloaded Installations'
    kind: update-cache
    risk: high
    purpose: 部分安装程序（InstallShield 等）保存的安装包
    impact: 删除后，对应程序可能无法修复或卸载
    tier: draft

  - id: sys.program-files
    under: '%PROGRAMFILES%'
    kind: program
    risk: never
    purpose: 已安装的程序
    impact: 不要手动删除，请在"设置 → 应用"里卸载

  - id: sys.program-files-x86
    under: '%PROGRAMFILES(X86)%'
    kind: program
    risk: never
    purpose: 已安装的 32 位程序
    impact: 不要手动删除，请在"设置 → 应用"里卸载

  - id: sys.vs-packages
    dir: '%PROGRAMDATA%\Microsoft\VisualStudio\Packages'
    kind: update-cache
    risk: guide
    label: 用 VS Installer
    purpose: Visual Studio 安装程序的包缓存
    impact: 可以在 Visual Studio Installer 的"更多 → 设置"里关闭"安装后保留下载缓存"，由安装程序自己清理
    evidence:
      - url: https://learn.microsoft.com/visualstudio/install/disable-or-move-the-package-cache
