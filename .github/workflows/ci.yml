# 研发方案第 6 节：构建、单元测试、规则校验。推送到 main 时再打包，并在全新的 windows-2022 / 2025 上冒烟测试（package.yml）。
# 测试盘上的删除验收需要管理员和 VHDX，在本机用 tools/verify 下的脚本跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 规则校验
        run: dotnet run --project tools/dtrule -c Release -- validate rules

      # 界面文字：Strings.resx 和源代码同步、没有没包成 L.T / L.F 的中文（见 tools/i18n/README.md）
      - name: 界面文字检查
        run: dotnet run --project tools/i18n -c Release -- check src src/DiskThinner.Core/Strings.resx

      - name: 构建
        run: dotnet build DiskThinner.slnx -c Release
      # 常驻服务按 Native AOT 发布（docs/phase2b-design.md 5.8 节）：AOT 警告（IL2xxx / IL3xxx）当作错误
      - name: 服务的 AOT 发布
        run: pwsh -NoProfile -File tools/verify/aot-check.ps1
      - name: 测试
        run: dotnet test DiskThinner.slnx -c Release --no-build --blame-hang-timeout 90s --blame-hang-dump-type mini --logger trx --results-directory TestResults

      # 失败的用例写成注解：运行页面上不登录也能看到是哪个测试、为什么失败
      - name: 失败的测试
        if: failure()
        run: pwsh -NoProfile -File tools/verify/test-annotations.ps1 -ResultsDir TestResults

      - name: 保存测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  package:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/package.yml
